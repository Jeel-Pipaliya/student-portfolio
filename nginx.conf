# Practical 11: Nginx Configuration for Containerized React Frontend
server {
    listen 80;
    server_name localhost;

    # Root directory containing built React distribution files
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip compression for static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Client-side React Router routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API requests to backend container via Docker bridge network
    location /tasks {
        proxy_pass http://backend:5000/tasks;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /login {
        proxy_pass http://backend:5000/login;
    }

    location /register {
        proxy_pass http://backend:5000/register;
    }

    location /cache {
        proxy_pass http://backend:5000/cache;
    }

    location /events {
        proxy_pass http://backend:5000/events;
    }
}
